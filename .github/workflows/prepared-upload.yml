name: Upload prepared game and attack editor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared files
        run: |
          sha256sum --check <<'CHECKSUM'
          1276c271460c719041481628769c6630a263ac2218fac10ae0323207f0bfd87b  release-upload/Quiet-Meadow-0.77.zip
          c32c3ef918f4667e50bcda76eea63994a6115344aebc8746a7610a42a1502d52  release-upload/Miku-Attack-Editor-v3.html
          8586e2f85007e7cfe0d20f11fa06df715a0d4f439d54c4b0e5eafc538f8e3601  release-upload/Miku-Attack-Editor-v3.zip
          CHECKSUM
      - name: Attach game
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.77 release-upload/Quiet-Meadow-0.77.zip
      - name: Attach attack editor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload miku-phase-two-prototype-v3 release-upload/Miku-Attack-Editor-v3.html release-upload/Miku-Attack-Editor-v3.zip

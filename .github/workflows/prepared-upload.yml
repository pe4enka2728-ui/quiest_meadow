name: Upload prepared game release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify prepared archive
        env:
          EXPECTED_SHA: "51126f04b2f161a1d3ba1ba250085d7be0aa42af4f3689079003412a2bc1d64b"
        run: |
          python - <<'PYVERIFY'
          import hashlib, os
          from pathlib import Path
          p = Path('release-upload/Quiet-Meadow-0.83.zip')
          assert p.stat().st_size == 85264439
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA']
          print('Prepared game archive verified')
          PYVERIFY
      - name: Attach the prepared game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.83 release-upload/Quiet-Meadow-0.83.zip --repo "$GITHUB_REPOSITORY"

name: Upload prepared game release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify prepared archive
        env:
          EXPECTED_SHA: "6c5a9bcbd9310c342c026ca89332f345eb9f1e5ee80beb0b94748d0e4ad11e08"
        run: |
          python - <<'PYVERIFY'
          import hashlib, os
          from pathlib import Path
          p = Path('release-upload/Quiet-Meadow-0.89.zip')
          assert p.stat().st_size == 104679635
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA']
          print('Prepared game archive verified')
          PYVERIFY
      - name: Attach the prepared game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.89 release-upload/Quiet-Meadow-0.89.zip --repo "$GITHUB_REPOSITORY"

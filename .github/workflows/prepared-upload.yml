name: Upload prepared game release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify prepared archive
        env:
          EXPECTED_SHA: "b14cfea30fc893d26e83419716ff75be68528ddbed341783a34acae459b2a2d8"
        run: |
          python - <<'PYVERIFY'
          import hashlib, os
          from pathlib import Path
          p = Path('release-upload/Quiet-Meadow-0.87.zip')
          assert p.stat().st_size == 103719550
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA']
          print('Prepared game archive verified')
          PYVERIFY
      - name: Attach the prepared game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.87 release-upload/Quiet-Meadow-0.87.zip --repo "$GITHUB_REPOSITORY"

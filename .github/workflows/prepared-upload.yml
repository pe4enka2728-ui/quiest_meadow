name: Upload prepared transition preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify prepared preview
        run: |
          python - <<'PYVERIFY'
          import hashlib
          from pathlib import Path
          expected = {'Battle-Transition-Preview-v1.html': {'size': 752683, 'sha': 'c743d30115ac03048f88e34c9b476a541a2a179157b7c135c1c5b3a65bd8316e'}, 'Battle-Transition-Preview-v1.mp4': {'size': 3225316, 'sha': 'd8b3dc72f8ad55a9060ff6ca683d6d3965281648730ef8d796c6dc00b7d3ac3c'}}
          for name, info in expected.items():
              p = Path('release-upload') / name
              assert p.stat().st_size == info['size']
              assert hashlib.sha256(p.read_bytes()).hexdigest() == info['sha']
          print('Preview files verified')
          PYVERIFY
      - name: Attach prepared preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload battle-transition-preview-v1 release-upload/Battle-Transition-Preview-v1.html release-upload/Battle-Transition-Preview-v1.mp4 --repo "$GITHUB_REPOSITORY"

name: Upload prepared legend preview v2 once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    if: github.ref == 'refs/heads/intro-legend-upload-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble and verify prepared files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path('release-upload')
          manifest = json.loads((root / 'manifest.json').read_text())
          for entry in manifest:
              target = root / entry['name']
              if entry.get('parts'):
                  with target.open('wb') as out:
                      for part in entry['parts']:
                          out.write((root / part).read_bytes())
              assert target.stat().st_size == entry['bytes'], target
              assert hashlib.sha256(target.read_bytes()).hexdigest() == entry['sha256'], target
              print(target.name, entry['bytes'], entry['sha256'])
          PY
      - name: Upload to the draft preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload intro-legend-preview-v2
          release-upload/Quiet-Meadow-Legend-Preview-v2.zip
          release-upload/Quiet-Meadow-Legend-Preview-v2.mp4
          release-upload/Quiet-Meadow-Book-Preview-v2.mp4
          --repo "$GITHUB_REPOSITORY"

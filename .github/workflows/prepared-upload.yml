name: Upload prepared game 0.80
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared archive
        run: |
          sha256sum --check <<'CHECKSUM'
          a0aca85b27eabec4195250c96adb2341ced533c733a0f32da2962a2b7920a7d7  release-upload/Quiet-Meadow-0.80.zip
          CHECKSUM
      - name: Attach prepared game
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.80 release-upload/Quiet-Meadow-0.80.zip

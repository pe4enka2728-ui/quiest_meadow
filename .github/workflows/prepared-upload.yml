name: Upload prepared game and attack editor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared files
        run: |
          sha256sum --check <<'CHECKSUM'
          c8a16e465e4b8fb2fec734ecbcb4b60daad579d42d6368227454cb47a67befad  release-upload/Quiet-Meadow-0.78.zip
          8f80bd36e7012cef1141db871f32cc62d625ddcf58705850181c22c74f8bf2f3  release-upload/Boss-Attack-Editor-v4.html
          b27b1739d9268403277e9e35bd37791dfcee744286de080aa90e962eb01ecb27  release-upload/Boss-Attack-Editor-v4.zip
          CHECKSUM
      - name: Attach game
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.78 release-upload/Quiet-Meadow-0.78.zip
      - name: Attach attack editor
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload boss-attack-editor-v4 release-upload/Boss-Attack-Editor-v4.html release-upload/Boss-Attack-Editor-v4.zip

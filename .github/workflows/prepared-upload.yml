name: Upload prepared game release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify prepared archive
        env:
          EXPECTED_SHA: "3b73a2ed9aaa6d62f179f4d79faffc9ac8e09e0c1650b6e99fa71a17465bde37"
        run: |
          python - <<'PYVERIFY'
          import hashlib, os
          from pathlib import Path
          p = Path('release-upload/Quiet-Meadow-0.86.zip')
          assert p.stat().st_size == 95633222
          assert hashlib.sha256(p.read_bytes()).hexdigest() == os.environ['EXPECTED_SHA']
          print('Prepared game archive verified')
          PYVERIFY
      - name: Attach the prepared game
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.86 release-upload/Quiet-Meadow-0.86.zip --repo "$GITHUB_REPOSITORY"

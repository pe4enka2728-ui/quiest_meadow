name: Upload prepared Miku prototype
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared prototype
        run: |
          sha256sum --check <<'CHECKSUM'
          f7fe990ce73172f950b7a22d8badda35fd12a83824985fc4e3d3d8dc6de8782b  release-upload/Miku-Phase-2-20-Attacks-Prototype.html
          2eb217ae078123d4a99c0f67f5d62464bf3751ac77355bb04d164cba81134579  release-upload/Miku-Phase-2-20-Attacks-Prototype.zip
          CHECKSUM
      - name: Attach isolated prototype
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload miku-phase-two-prototype-v1 release-upload/Miku-Phase-2-20-Attacks-Prototype.html release-upload/Miku-Phase-2-20-Attacks-Prototype.zip

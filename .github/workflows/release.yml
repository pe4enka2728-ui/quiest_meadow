name: Build and release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependency
        run: python -m pip install -r requirements.txt
      - name: Run model tests
        run: node --test tests/*.test.cjs
      - name: Build standalone game
        run: python build.py
      - name: Package tagged release
        if: github.event_name == 'push'
        run: python tools/package_release.py --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Package preview build
        if: github.event_name == 'workflow_dispatch'
        run: python tools/package_release.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: quiet-meadow-${{ github.ref_name }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; its published files are preserved."
            exit 0
          fi
          note_file="CHANGES_$(printf '%s' "${RELEASE_TAG#v}" | tr -d '.')"
          note_file="${note_file}.md"
          if [[ ! -f "$note_file" ]]; then
            note_file=README.md
          fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "Тихая поляна ${RELEASE_TAG#v}" \
            --notes-file "$note_file"

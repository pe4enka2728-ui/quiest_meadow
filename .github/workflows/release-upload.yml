name: Upload prepared release ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared archive
        run: |
          sha256sum --check <<'CHECKSUM'
          8a5c05505d0082e62895d2b74177d472c73f604078b476aa275e36965d70829b  release-upload/Quiet-Meadow-0.61.zip
          CHECKSUM
      - name: Attach game archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.61 release-upload/Quiet-Meadow-0.61.zip

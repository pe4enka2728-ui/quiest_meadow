name: Upload prepared release ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared archive
        run: |
          sha256sum --check <<'CHECKSUM'
          a26baf70a800c8cbb32a1864f18ae8d8be7be6ff5aaf23906b3466e162c7386f  release-upload/Quiet-Meadow-0.70.zip
          CHECKSUM
      - name: Attach game archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.70 release-upload/Quiet-Meadow-0.70.zip

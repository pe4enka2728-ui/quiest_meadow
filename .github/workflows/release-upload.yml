name: Upload prepared release ZIP
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify prepared archive
        run: |
          sha256sum --check <<'CHECKSUM'
          9517465b1a496cb7aa2d11a34390db722bb6c4cc5ed640a40721bfb95ff83db5  release-upload/Quiet-Meadow-0.75.zip
          CHECKSUM
      - name: Attach game archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v0.75 release-upload/Quiet-Meadow-0.75.zip

name: Upload prepared game 0.90 once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    if: github.ref == 'refs/heads/intro-legend-upload-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Assemble and verify the prepared game archive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, hashlib
          root = Path('release-upload-090')
          manifest = json.loads((root / 'manifest.json').read_text())
          for entry in manifest:
              target = root / entry['name']
              with target.open('wb') as out:
                  for part in entry['parts']:
                      out.write((root / part).read_bytes())
              assert target.stat().st_size == entry['bytes'], target
              assert hashlib.sha256(target.read_bytes()).hexdigest() == entry['sha256'], target
              print(target.name, entry['bytes'], entry['sha256'])
          PY
      - name: Upload the game to its draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload v0.90
          release-upload-090/Quiet-Meadow-0.90.zip
          --repo "$GITHUB_REPOSITORY"
